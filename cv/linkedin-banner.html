<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn banner — Boris Huarachi</title>
  <meta name="robots" content="noindex" />
  <!-- Source of assets/linkedin-banner.png (1584×396, LinkedIn's banner size). Rendered with Chromium.
       The profile photo covers the bottom-left corner on LinkedIn, so that area stays empty. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;600&family=Orbitron:wght@800&display=block" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1584px; height: 396px; overflow: hidden; background: #000; }
    body { position: relative; font-family: "Geist", sans-serif; color: #f2f2f2;
      background:
        radial-gradient(ellipse 38% 90% at 36% 46%, rgba(179, 18, 46, .30), transparent 70%),
        radial-gradient(ellipse 30% 70% at 92% 10%, rgba(179, 18, 46, .16), transparent 70%),
        radial-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px) 0 0 / 26px 26px,
        #000; }
    canvas { position: absolute; inset: 0; }
    .txt { position: absolute; right: 84px; top: 50%; transform: translateY(-50%); text-align: right; }
    .prompt { font: 600 15px "Geist Mono", monospace; color: #8a8f8a; letter-spacing: .02em; }
    .prompt b { color: #e0344f; font-weight: 600; }
    h1 { margin-top: 14px; font: 800 58px/1 "Orbitron", sans-serif; letter-spacing: -1px; }
    h1 i { display: inline-block; width: 13px; height: 13px; margin-left: 6px; background: #e0344f; }
    .stack { margin-top: 18px; font: 400 17px "Geist Mono", monospace; color: #b9bdb9; letter-spacing: .02em; }
    .stack span { color: #5c625c; margin: 0 8px; }
    .web { margin-top: 16px; font: 600 19px "Geist Mono", monospace; color: #e0344f; letter-spacing: .03em; }
    .web::before { content: "→ "; color: #8a8f8a; }
    .hud { position: absolute; font: 400 12px "Geist Mono", monospace; color: #4f554f; letter-spacing: .08em; }
    .hud.tr { top: 22px; right: 28px; }
    .hud.tl { top: 22px; left: 28px; }
  </style>
</head>
<body>
  <canvas id="c" width="1584" height="396"></canvas>
  <div class="hud tl">03 — LIVE · 100 / 100</div>
  <div class="hud tr">41.39°N 2.17°E · BARCELONA</div>
  <div class="txt">
    <p class="prompt"><b>boris@prod</b>:~$ whoami</p>
    <h1>DevOps Engineer<i></i></h1>
    <p class="stack">AWS<span>·</span>Azure<span>·</span>GCP<span>·</span>Terraform<span>·</span>Kubernetes<span>·</span>CI/CD</p>
    <p class="web">borisdevops.com</p>
  </div>
  <script>
    // Seeded random so the banner renders identically every time
    let seed = 20261123;
    const rnd = (a = 0, b = 1) => { seed = (seed * 1664525 + 1013904223) >>> 0; return a + (seed / 4294967296) * (b - a); };
    const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
    const ctx = document.getElementById("c").getContext("2d");
    const W = 1584, H = 396, TAU = Math.PI * 2;
    // stars
    for (let i = 0; i < 420; i++) { ctx.globalAlpha = rnd(.12, .7); ctx.fillStyle = "#fff"; const s = rnd(.4, 1.5); ctx.fillRect(rnd(0, W), rnd(0, H), s, s); }
    // black hole, left of centre (clear of the profile photo's corner)
    const cx = 560, cy = 182, r = 62, sx = 1.2, sy = .2;
    const halo = ctx.createRadialGradient(cx, cy, r, cx, cy, r * 5);
    halo.addColorStop(0, "rgba(255,255,255,.08)"); halo.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = 1; ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1;
    for (const m of [2.1, 3.1, 4.6, 6.4]) { ctx.beginPath(); ctx.ellipse(cx, cy, r * m * sx, r * m * sy, -.06, 0, TAU); ctx.stroke(); }
    const disk = Array.from({ length: 5200 }, () => ({ R: 1.3 + Math.pow(rnd(), 2.2) * 4.6, a: rnd(0, TAU), y: gauss() * .05, s: rnd(.6, 2), red: rnd() < .05 }));
    const drawDisk = back => {
      for (const p of disk) {
        const s = Math.sin(p.a); if ((s < 0) !== back) continue;
        const x = cx + Math.cos(p.a) * p.R * r * sx, y = cy + (s * p.R * sy + p.y * p.R * .4) * r - Math.cos(p.a) * p.R * r * .06;
        const bright = (1.4 - p.R / 6) * (1 + .35 * -Math.cos(p.a));
        ctx.globalAlpha = Math.min(1, .8 * bright); ctx.fillStyle = p.red ? "#e0344f" : "#f2f2f2"; ctx.fillRect(x, y, p.s, p.s);
      }
      ctx.globalAlpha = 1;
    };
    drawDisk(true);
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.clip(); ctx.strokeStyle = "rgba(255,255,255,.17)";
    for (let i = 0; i < 6; i++) { const ph = (i / 6) * Math.PI + .4; ctx.beginPath(); ctx.ellipse(cx, cy, Math.abs(Math.cos(ph)) * r, r, 0, 0, TAU); ctx.stroke(); }
    for (let j = -2; j <= 2; j++) { const yy = cy + (j / 3) * r, ww = Math.sqrt(r * r - (yy - cy) ** 2); ctx.beginPath(); ctx.ellipse(cx, yy, ww, ww * .12, 0, 0, TAU); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = r * .32; ctx.beginPath(); ctx.arc(cx, cy, r * 1.2, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.24)"; ctx.lineWidth = r * .12; ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, TAU); ctx.stroke();
    for (let i = 0; i < 1800; i++) { const R = 1.04 + Math.abs(gauss()) * .2, a = rnd(0, TAU); ctx.globalAlpha = Math.max(.15, 1 - (R - 1.04) * 2.2); ctx.fillStyle = "#f2f2f2"; const s = rnd(.5, 1.6); ctx.fillRect(cx + Math.cos(a) * R * r, cy + Math.sin(a) * R * r, s, s); }
    ctx.globalAlpha = 1; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, cy, r * 1.04, 0, TAU); ctx.stroke();
    drawDisk(false);
    window.rendered = true;
  </script>
</body>
</html>
